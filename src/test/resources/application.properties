spring.application.name=link-shortener-analytics-service
spring.threads.virtual.enabled=true

spring.cloud.config.enabled=false
spring.config.import=optional:vault://

topic.link.clicks=link-clicks-topic
topic.link.lifecycle=link-lifecycle-events
topic.analytics.enriched=analytics-enriched-clicks-events

spring.kafka.consumer.group-id=test-group-${random.uuid}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=io.confluent.kafka.serializers.protobuf.KafkaProtobufDeserializer

# Schema Registry Configs for Consumer
spring.kafka.consumer.properties.schema.registry.url=mock://test-registry
spring.kafka.consumer.properties.derive.type=true

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=io.confluent.kafka.serializers.protobuf.KafkaProtobufSerializer

# Schema Registry Configs for Producer
spring.kafka.producer.properties.schema.registry.url=mock://test-registry
spring.kafka.producer.properties.auto.register.schemas=true
spring.kafka.producer.properties.use.latest.version=false